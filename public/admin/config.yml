# Editor settings for /admin (Sveltia CMS).
# Changes made in the editor are committed to the repo below,
# and GitHub Pages redeploys the site in about two minutes.

backend:
  name: github
  repo: avingaur1/avin-site   # <your-github-username>/<repo-name>
  branch: main
  auth_methods: [token]       # sign in with a GitHub personal access token
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

# Where uploaded photos go, and how pages refer to them.
media_folder: public/images
public_folder: /images

media_libraries:
  default:
    config:
      max_file_size: 20000000
      slugify_filename: true
      # Phone photos are shrunk and converted to WebP in the browser before upload,
      # so the site stays fast.
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

collections:
  # ---------------------------------------------------------------- Posts
  - name: thoughts
    label: Thoughts
    label_singular: Post
    description: Posts in the Thoughts section. A post shows on the site once Draft is off.
    folder: content/thoughts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Publish date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - name: draft
        label: Draft
        widget: boolean
        default: false
        hint: Turn on to keep this post hidden from the site.
      - name: summary
        label: Summary
        widget: string
        required: false
        hint: One line shown in search results and link previews.
      - { name: body, label: Post, widget: markdown }

  # ------------------------------------------------------- Homepage content
  - name: site
    label: Homepage
    files:
      - name: homepage
        label: Homepage text, photos and links
        file: content/site.json
        fields:
          - name: intro
            label: Introduction
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: Name heading, widget: string }
              - name: lines
                label: Lines under the name
                widget: list
                field: { name: line, label: Line, widget: text }

          - name: work
            label: Work
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: subheading, label: Subheading, widget: string, required: false }
              - name: entries
                label: Entries
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: role, label: Role, widget: string, required: false }
                  - name: period
                    label: Period
                    widget: string
                    required: false
                    hint: "Optional, e.g. “Jun – Aug 2026” or “2027 – present”. Shown in small grey text."
                  - { name: description, label: Description, widget: text, required: false }
                  - name: href
                    label: Link
                    widget: string
                    required: false
                    hint: Optional. Adds a small arrow and makes the row clickable.

          - name: campus
            label: My Journey at Campus
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro paragraph, widget: text }
              - name: entries
                label: Stories
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Title, widget: string }
                  - name: href
                    label: Website
                    widget: string
                    required: false
                    hint: Optional. Makes the title a link with a small ↗ that opens in a new tab.
                  - name: paragraphs
                    label: Paragraphs
                    widget: list
                    field: { name: paragraph, label: Paragraph, widget: text }
                  - name: photos
                    label: Photos
                    widget: list
                    required: false
                    max: 3
                    hint: Up to three. They appear in a small row under the text.
                    summary: "{{fields.alt}}"
                    fields:
                      - { name: src, label: Photo, widget: image }
                      - { name: alt, label: Description (for screen readers), widget: string }
                      - { name: caption, label: Caption, widget: string, required: false }

          - name: thoughts
            label: Thoughts section
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: subheading, label: Subheading, widget: string, required: false }
              - { name: emptyMessage, label: Message when nothing is published, widget: string }
              - name: mediumUsername
                label: Medium username
                widget: string
                required: false
                hint: "Without the @, e.g. avingaur. Your latest Medium posts appear in Thoughts, linking to Medium. New ones show up within a day."

          - name: beyond
            label: Beyond the Resume
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: description, label: Description, widget: text }
              - name: items
                label: Interests
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: text, label: Text, widget: string, required: false, hint: Leave empty to hide this row. }
                  - { name: href, label: Link, widget: string, required: false }
              - name: photos
                label: Photo strip
                widget: list
                min: 3
                max: 3
                hint: Three slots. Empty ones show a placeholder frame. Use your own photos.
                summary: "{{fields.alt}}"
                fields:
                  - { name: src, label: Photo, widget: image, required: false }
                  - { name: alt, label: Description (for screen readers), widget: string, required: false }
                  - { name: caption, label: Caption, widget: string, required: false }
              - name: interactiveResume
                label: Interactive resume link
                widget: object
                fields:
                  - { name: label, label: Link text, widget: string }
                  - { name: href, label: URL, widget: string, required: false, hint: Hidden while empty. }

          - name: connect
            label: Let's Connect
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - name: links
                label: Links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - name: href
                    label: URL
                    widget: string
                    required: false
                    hint: "For email use mailto:you@example.com. Hidden while empty."

          - name: footer
            label: Footer
            widget: object
            collapsed: true
            fields:
              - { name: left, label: Left text, widget: string }
              - { name: right, label: Right text, widget: string }

          - name: url
            label: Site address
            widget: string
            hint: Your live address, e.g. https://avingaur.com. Used for link previews and search.
          - name: description
            label: Site description
            widget: text
            hint: Shown in Google results and link previews.
